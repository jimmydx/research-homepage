<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Social preview for Jaime Aguilar Guerrero research homepage</title>
  <desc id="desc">Branded card with research homepage title and focus areas.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2940"/>
      <stop offset="100%" stop-color="#0d6f8f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>
  <g fill="none" stroke="rgba(255,255,255,0.25)">
    <circle cx="180" cy="110" r="160"/>
    <circle cx="1050" cy="520" r="190"/>
    <circle cx="980" cy="130" r="90"/>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" fill="#ffffff">
    <text x="92" y="128" font-size="34" font-weight="700" letter-spacing="2">RESEARCH HOMEPAGE</text>
    <text x="92" y="255" font-family="Merriweather, Georgia, serif" font-size="72" font-weight="700">Jaime Aguilar Guerrero</text>
    <text x="92" y="322" font-size="34">Gravity Waves | Airglow Imaging | Geospace Data Fusion</text>
    <rect x="92" y="388" width="740" height="72" rx="36" ry="36" fill="rgba(255,255,255,0.18)"/>
    <text x="122" y="434" font-size="34" font-weight="700">Projects, Publications, CV, and Collaboration Contact</text>
  </g>
</svg>
